
<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Đăng ký tài khoản</title>

    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
          rel="stylesheet">

    <style>
        body {
            background: #f0f4f8;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 30px 15px;
        }

        .register-card {
            width: 100%;
            max-width: 600px;
            background: white;
            padding: 35px;
            border-radius: 16px;
            box-shadow: 0 5px 25px rgba(0, 0, 0, 0.1);
        }

        .register-title {
            color: #0d6efd;
            font-weight: bold;
        }
    </style>
</head>
<body>

    <div class="register-card">
        <h2 class="text-center register-title mb-2">
            Đăng ký tài khoản
        </h2>

        <p class="text-center text-muted mb-4">
            Điền thông tin để tạo tài khoản mới
        </p>

        <form>
            <!-- Họ và tên -->
            <div class="mb-3">
                <label for="fullname" class="form-label">Họ và tên</label>
                <input type="text" class="form-control" id="fullname"
                       placeholder="Nhập họ và tên" required>
            </div>

            <!-- Email -->
            <div class="mb-3">
                <label for="email" class="form-label">Email</label>
                <input type="email" class="form-control" id="email"
                       placeholder="example@gmail.com" required>
            </div>

            <!-- Mật khẩu -->
            <div class="mb-3">
                <label for="password" class="form-label">Mật khẩu</label>
                <input type="password" class="form-control" id="password"
                       placeholder="Nhập mật khẩu" required>
            </div>

            <!-- Xác nhận mật khẩu -->
            <div class="mb-3">
                <label for="confirmPassword" class="form-label">
                    Xác nhận mật khẩu
                </label>
                <input type="password" class="form-control"
                       id="confirmPassword"
                       placeholder="Nhập lại mật khẩu" required>
            </div>

            <!-- Giới tính -->
            <div class="mb-3">
                <label class="form-label d-block">Giới tính</label>

                <div class="form-check form-check-inline">
                    <input class="form-check-input" type="radio"
                           name="gender" id="male" value="Nam" required>
                    <label class="form-check-label" for="male">Nam</label>
                </div>

                <div class="form-check form-check-inline">
                    <input class="form-check-input" type="radio"
                           name="gender" id="female" value="Nữ">
                    <label class="form-check-label" for="female">Nữ</label>
                </div>

                <div class="form-check form-check-inline">
                    <input class="form-check-input" type="radio"
                           name="gender" id="other" value="Khác">
                    <label class="form-check-label" for="other">Khác</label>
                </div>
            </div>

            <!-- Sở thích -->
            <div class="mb-3">
                <label class="form-label d-block">Sở thích</label>

                <div class="form-check">
                    <input class="form-check-input" type="checkbox"
                           id="reading" name="hobbies" value="Đọc sách">
                    <label class="form-check-label" for="reading">
                        Đọc sách
                    </label>
                </div>

                <div class="form-check">
                    <input class="form-check-input" type="checkbox"
                           id="music" name="hobbies" value="Nghe nhạc">
                    <label class="form-check-label" for="music">
                        Nghe nhạc
                    </label>
                </div>

                <div class="form-check">
                    <input class="form-check-input" type="checkbox"
                           id="travel" name="hobbies" value="Du lịch">
                    <label class="form-check-label" for="travel">
                        Du lịch
                    </label>
                </div>
            </div>

            <!-- Quốc gia -->
            <div class="mb-4">
                <label for="country" class="form-label">Quốc gia</label>
                <select class="form-select" id="country" required>
                    <option value="" selected disabled>
                        -- Chọn quốc gia --
                    </option>
                    <option value="Vietnam">Việt Nam</option>
                    <option value="Japan">Nhật Bản</option>
                    <option value="Korea">Hàn Quốc</option>
                    <option value="USA">Hoa Kỳ</option>
                    <option value="Other">Khác</option>
                </select>
            </div>

            <!-- Nút Submit -->
            <button type="submit" class="btn btn-primary w-100">
                Đăng ký
            </button>

            <p class="text-center text-muted mt-3 mb-0">
                Vui lòng kiểm tra thông tin trước khi đăng ký.
            </p>
        </form>
    </div>

    <script>
        document.querySelector("form").addEventListener("submit", function(event) {
            event.preventDefault();

            const password = document.getElementById("password").value;
            const confirmPassword =
                document.getElementById("confirmPassword").value;

            if (password !== confirmPassword) {
                alert("Mật khẩu xác nhận không khớp!");
                return;
            }

            alert("Đăng ký thành công! Đây là trang demo.");
        });
    </script>

</body>
</html>
